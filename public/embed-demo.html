<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer App — Embed SDK Live Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0B0F19; color: #FFF; padding: 36px 20px; text-align: center; }
    .btn-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 24px auto; max-width: 720px; }
    button { background: #1D2538; color: #FFF; border: 1px solid #334155; padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
    button:hover { border-color: #00E599; color: #00E599; }
    #inline-slot { display: flex; justify-content: center; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>External Customer App (Powered by Gamify SDK)</h1>
  <p style="color:#94A3B8; margin-top:6px;">Click any button to trigger customized widgets via <code>gamify.launchModal()</code> or <code>gamify.mount()</code></p>

  <div class="btn-grid">
    <button onclick="gamify.launchModal('cred_slot_09')" style="border-color:#F59E0B; color:#F59E0B;">🎰 Launch CRED Slot Machine</button>
    <button onclick="gamify.launchModal('cred_wheel_07')">🎡 Launch CRED Spin Wheel</button>
    <button onclick="gamify.launchModal('mynaksh_checkin_02')">🌟 Launch MyNaksh 1:1 Streak &amp; Mantra</button>
    <button onclick="gamify.launchModal('gamify_leaderboard_08')">🏆 Launch Triple Podium Leaderboard</button>
    <button onclick="gamify.launchModal('zepto_scratch_01')">🎫 Launch Zepto Scratch Modal</button>
    <button onclick="gamify.launchModal('duolingo_flow_06')">🦉 Launch Duolingo Flow</button>
    <button onclick="gamify.launchModal('paytm_chest_04')">🎁 Launch Paytm Chest Flip</button>
    <button onclick="gamify.launchModal('paytm_spin_05')">🎡 Launch Paytm Spin &amp; Win</button>
    <button onclick="gamify.launchModal('instaastro_points_03')">🪙 Launch InstaAstro Points</button>
    <button onclick="gamify.openStickerAlbum()" style="background: linear-gradient(135deg, #EC4899, #8B5CF6); color: #FFF; font-weight: 800;">📖 Open Sticker Album (15 Badges)</button>
    <button onclick="gamify.unlockSticker('binge_watcher')" style="background: linear-gradient(135deg, #FFB800, #F59E0B); color: #0F172A; font-weight: 800;">⚡ Test Sticker Unlock (Binge Watcher)</button>
  </div>

  <div id="inline-slot"></div>

  <script src="/sdk/gamify.js" data-api-key="pk_live_duo_9821"></script>
  <script>
    const gamify = new Gamify();
    gamify.identify('demo_user_001', { tier: 'gold' });
    gamify.mount('#inline-slot', 'zepto_scratch_01');
  </script>
</body>
</html>
